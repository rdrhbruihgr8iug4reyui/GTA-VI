services:
  - type: web
    name: gta6hub
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.163.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SSL
        value: "1"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TO
        sync: false
      - key: SMTP_FROM
        value: GTA VI 查询站
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_REGISTER_OPEN
        value: "1"
